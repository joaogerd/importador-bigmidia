<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Importador Yoka</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; width: 360px; margin: 0; padding: 14px; color: #17212b; background:#fff; }
    header { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
    .logo { width:44px; height:44px; border-radius:50%; background:#fff; color:white; display:grid; place-items:center; font-weight:800; overflow:hidden; flex:none; border:1px solid #dce2e8; }
    .logo img { width:100%; height:100%; object-fit:contain; background:white; }
    h1 { font-size:17px; margin:0; color:#174a7e; }
    .sub { font-size:11px; color:#6b7785; margin-top:2px; }
    .version { font-weight:700; color:#174a7e; }
    .section { border-top:1px solid #e5e9ed; padding-top:11px; margin-top:11px; }
    .section-title { font-size:12px; font-weight:800; color:#174a7e; margin-bottom:7px; }
    button { width:100%; border:0; border-radius:7px; padding:10px 12px; background:#174a7e; color:#fff; font-weight:700; cursor:pointer; }
    button:hover { filter:brightness(.96); }
    button.secondary { background:#fff; color:#174a7e; border:1px solid #b9c6d2; margin-top:7px; }
    button:disabled { opacity:.55; cursor:default; }
    input { width:100%; border:1px solid #cbd4dc; border-radius:7px; padding:9px 10px; font-size:13px; outline:none; }
    input:focus { border-color:#174a7e; box-shadow:0 0 0 2px rgba(23,74,126,.1); }
    .hint { font-size:10px; line-height:1.4; color:#6b7785; margin-top:6px; }
    .status { font-size:10px; line-height:1.4; color:#6b7785; margin-top:7px; min-height:14px; }
    .status.error { color:#b42318; }
    .results { margin-top:7px; max-height:260px; overflow:auto; border-radius:7px; }
    .result { display:block; width:100%; text-align:left; padding:9px 10px; margin:0 0 5px; background:#fff; border:1px solid #dce2e8; color:#17212b; border-radius:7px; cursor:pointer; }
    .result:hover { border-color:#174a7e; background:#f7f9fb; filter:none; }
    .result.unsynced { cursor:default; opacity:.72; }
    .result strong { display:block; font-size:12px; line-height:1.3; }
    .meta { display:block; margin-top:3px; font-size:10px; line-height:1.35; color:#6b7785; font-weight:400; }
    .meta.ok { color:#147a42; }
    .footer { border-top:1px solid #e5e9ed; margin-top:11px; padding-top:9px; font-size:9px; line-height:1.4; color:#7a8692; }
  </style>
</head>
<body>
  <header>
    <div class="logo"><img id="popup-logo-img" alt="Logo do Yoka"><span id="popup-logo-fallback" hidden>YK</span></div>
    <div><h1>Importador Yoka</h1><div class="sub">Liga Paulista / BigMidia · <span id="popup-version" class="version">v?</span></div></div>
  </header>

  <button id="open-create" type="button">Novo cadastro</button>

  <div class="section">
    <div class="section-title">Buscar atleta para editar</div>
    <input id="athlete-search" type="search" autocomplete="off" placeholder="Digite o nome do atleta">
    <div id="search-status" class="status">Digite pelo menos 2 caracteres.</div>
    <div id="search-results" class="results"></div>
  </div>

  <div class="section">
    <button id="open-index" class="secondary" type="button">Abrir lista de atletas da Liga</button>
    <div class="hint">Atletas com número da Liga sincronizado abrem diretamente na tela de edição.</div>
  </div>

  <div class="footer">A extensão não clica no botão final <strong>Cadastrar</strong>.</div>
  <script src="popup.js"></script>
</body>
</html>
