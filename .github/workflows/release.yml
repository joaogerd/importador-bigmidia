name: Release Chrome extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            version="$(tr -d '[:space:]' < VERSION)"
            tag="v${version}"
          fi
          version="${tag#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          manifest_version="$(python -c 'import json; print(json.load(open("manifest.json", encoding="utf-8"))["version"])')"
          [[ "$file_version" == "$version" ]] || { echo "VERSION=$file_version, tag=$version" >&2; exit 1; }
          [[ "$manifest_version" == "$version" ]] || { echo "manifest=$manifest_version, tag=$version" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build installable ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          asset="importador-bigmidia-v${version}.zip"
          files=(manifest.json content.js styles.css icons)
          [[ -f background.js ]] && files+=(background.js)
          [[ -f popup.html ]] && files+=(popup.html)
          [[ -f popup.js ]] && files+=(popup.js)
          [[ -f exemplo-atletas.csv ]] && files+=(exemplo-atletas.csv)
          [[ -f EXTENSION_README.md ]] && cp EXTENSION_README.md README-extension.md
          [[ -f README-extension.md ]] && files+=(README-extension.md)
          zip -q -r "$asset" "${files[@]}"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          asset="${{ steps.package.outputs.asset }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" \
              --title "Importador BigMidia ${tag}" \
              --generate-notes
          fi
